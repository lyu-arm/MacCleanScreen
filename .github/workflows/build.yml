name: 构建 MacCleanScreen

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并验证 macOS 应用
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 显示构建环境
        run: |
          sw_vers
          swift --version

      - name: 编译应用
        run: ./scripts/build-app.sh

      - name: 验证应用包
        run: |
          plutil -lint dist/MacCleanScreen.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/MacCleanScreen.app

      - name: 打包构建产物
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacCleanScreen.app MacCleanScreen.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          path: MacCleanScreen.zip
          archive: false
          retention-days: 14
